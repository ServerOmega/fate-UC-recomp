# keys.ini — Fate/Unlimited Codes (build nativo)
#
# Layout: setas movem (D-pad e analogico esquerdo juntos).
# A S D F = quadrado, triangulo, circulo, cruz.
# Z X C V = L1, L2, R1, R2.
# Enter = Start, Tab = Select, Espaco = cruz (cancela).
# F2 salva, F4 carrega, F3 estilo, F1 menu.
#
# REGRA DESTE ARQUIVO: uma tecla, uma acao. Tecla repetida em duas linhas faz o
# jogo receber dois botoes ao mesmo tempo e o controle parece morto.
#
# Disco japones: CIRCULO confirma, CRUZ cancela (ao contrario do padrao ocidental).

# --------------------------------------------------- MOVIMENTO: as setas
# Setas mandam nos dois ao mesmo tempo: no D-pad (movimento preciso de jogo de
# luta, base para baixo-frente etc.) e no analogico esquerdo (que e o que os
# MENUS leem — medido: D-pad sozinho nao navegava, stick navegava).
dpad_up     = Up
dpad_down   = Down
dpad_left   = Left
dpad_right  = Right

# ------------------------------------------------------- analogico esquerdo
# Mesmas setas do D-pad acima. Nada de WASD aqui: WASD agora e ataque.
left_up     = Up
left_down   = Down
left_left   = Left
left_right  = Right

# --------------------------------------------------------- analogico direito
# Camera. Sem tecla: o jogo de luta nao usa stick direito.
right_up    = none
right_down  = none
right_left  = none
right_right = none

# ------------------------------------------------ GOLPES: ASDF e ZXCV
# Fileira de cima = os quatro botoes da direita; fileira de baixo = os ombros.
# Layout de arcade: mao esquerda nas setas, direita nos golpes.
# Japao: circulo confirma nos menus, entao D tambem confirma.
square      = A
triangle    = S
circle      = D
cross       = F, Space

# ------------------------------------------------------------------ ombros
l1          = Z
l2          = X
r1          = C
r2          = V

# --------------------------------------------------------- sticks apertados
l3          = none
r3          = none

# ------------------------------------------------------- Start e Select
start       = Enter, Kp Enter, Esc
select      = Tab, Backspace

# --------------------------------------------- acoes que este jogo nao usa
# roll e rage sao de God of War. Vazias para nao sequestrar tecla util.
roll        = none
rage        = none
help        = none
menu        = none

# ---------------------------------------------------------------- mouse
mouse_stick = off
mouse_speed = 1
mouse_invert = off
mouse_deadzone = 0

# =====================================================================
# Imagem: TUDO NO MINIMO
# =====================================================================
# filtro de ampliacao: crisp = pixels duros, sem suavizacao (o mais barato)
look = soft_edges
# resolucao interna: 1x, o nativo do console (nada de supersampling)
scale = 1
# texto/2D: soft = bilinear simples, sem nitidez extra
sharp_2d = soft
# sem espera de quadro: entrega o mais rapido que a GPU aceitar
pace = audio
